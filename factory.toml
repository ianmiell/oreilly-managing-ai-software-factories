# Software factory configuration.
# Relative paths are resolved from the directory containing this file.

prompts_dir = "prompts"

[target]
repo = ".demo/target"              # created by `python -m factory setup`
base_branch = "main"
worktrees_dir = ".demo/worktrees"

[intake]
source = "local"                   # "local" reads issues/<id>/issue.md, "github" uses `gh issue view`
issues_dir = "issues"

[agent]
mode = "replay"                    # "replay" (no API key needed) or "cli" (a real coding agent)
replays_dir = "replays"
replay_delay_seconds = 1.5         # makes replayed runs feel live on stage
timeout_seconds = 900
# Command for "cli" mode. If no part contains {prompt}, the prompt is sent on stdin.
# Check these flags against the version of your agent CLI.
command = ["claude", "-p", "--output-format", "json", "--permission-mode", "acceptEdits"]
# command = ["codex", "exec", "--full-auto", "-"]

[gates]
# {python} is replaced with the interpreter running the factory.
checks = [
  ["{python}", "-m", "pytest", "-q"],
  ["{python}", "-m", "ruff", "check", "."],
]
timeout_seconds = 300
protected_paths = ["tests/"]       # agent may add files here, never modify or delete them
acceptance_dir = "tests/acceptance"

[retry]
max_attempts = 3

[review]
mode = "replay"                    # "replay" or "cli"
reviewers = ["correctness", "security", "conventions"]
timeout_seconds = 300
command = ["claude", "-p", "--output-format", "json", "--allowedTools", "Read,Grep,Glob"]

[review.focus]
general = "Is this change correct, safe, and consistent with the conventions?"
correctness = "Does the change fully implement the issue, including requirements the tests may not cover?"
security = "Could the change introduce unsafe input handling, secrets, or risky dependencies?"
conventions = "Does the change follow AGENTS.md and keep the diff minimal?"

[pr]
mode = "local"                     # "local" writes a PR summary file, "github" pushes and opens a draft PR
local_dir = ".factory/prs"

[state]
db = ".factory/state.db"
